<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev Fixture v1 | Landing</title>
</head>
<body data-fixture-version="safari-fixture-v1">
  <main>
    <h1>Jev Fixture v1</h1>
    <p id="fixture-state" role="status" aria-live="polite">State: landing</p>
    <button id="reviewed-view" type="button" aria-label="Select reviewed fixture view">
      Show reviewed fixture view
    </button>
    <button id="landing-view" type="button" aria-label="Return to landing fixture view" hidden>
      Return to landing fixture view
    </button>
  </main>
  <script>
    var state = document.getElementById('fixture-state');
    var reviewedButton = document.getElementById('reviewed-view');
    var landingButton = document.getElementById('landing-view');

    reviewedButton.addEventListener('click', function () {
      state.textContent = 'State: reviewed';
      document.title = 'Jev Fixture v1 | Reviewed';
      reviewedButton.hidden = true;
      landingButton.hidden = false;
    });

    landingButton.addEventListener('click', function () {
      state.textContent = 'State: landing';
      document.title = 'Jev Fixture v1 | Landing';
      landingButton.hidden = true;
      reviewedButton.hidden = false;
    });
  </script>
</body>
</html>
